html,body{margin:0;padding:0}
body{background:#fdf6ef;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#251f21}
main{display:block;box-sizing:border-box;max-width:520px;min-height:100vh;margin:0 auto;padding:24px 20px 32px;background:#fff;box-shadow:0 0 24px rgba(122,62,72,.08)}
.zb-hero{margin:-24px -24px 0;background:linear-gradient(#fdeef1,#fff 85%);text-align:center}

.zb-awning{height:44px;background:repeating-linear-gradient(90deg,#d9889b 0 26px,#fdf1f3 26px 52px)}
.zb-scallop{height:13px;background:
 radial-gradient(circle at 13px 0,#d9889b 12.5px,rgba(0,0,0,0) 13.5px) 0 0/52px 13px repeat-x,
 radial-gradient(circle at 39px 0,#fdf1f3 12.5px,rgba(0,0,0,0) 13.5px) 0 0/52px 13px repeat-x}
.zb-hero-in{padding:26px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:8px}
.zb-hero-art{position:relative;display:flex;align-items:center;justify-content:center;width:190px;height:150px;border-radius:50%;background:#fff;box-shadow:0 8px 24px rgba(122,62,72,.12)}
.zb-h1{position:absolute;top:16px;inset-inline-start:20px}
.zb-h2{position:absolute;bottom:22px;inset-inline-end:26px}
.zb-title{font-family:Georgia,'Times New Roman',serif;font-size:44px;line-height:1.1;margin:10px 0 0;color:#7a3e48;letter-spacing:-0.02em;direction:ltr}
.zb-tag{margin:0;font-size:20px;font-weight:600;color:#a35567}
.zb-sub{margin:0 0 10px;color:#585254;font-size:15px}
.zb-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.zb-btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;box-sizing:border-box;padding:10px 20px;border-radius:32px;color:#fff;text-decoration:none;direction:ltr;box-shadow:0 4px 12px rgba(122,62,72,.18)}
.zb-bt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.zb-bt b{font-size:17px;font-weight:600}
.zb-bt small{font-size:12.5px;font-weight:350;opacity:.92;direction:ltr}
.zb-ig{background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af)}
.zb-fb{background:#1877f2}
.zb-div{display:flex;align-items:center;gap:12px;margin:20px 0 4px;color:#d9889b}
.zb-div i{flex:1;height:1px;background:#f0d9de}
.zb-gallery-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:6px}
.zb-h{font-family:Georgia,'Times New Roman',serif;font-size:26px;margin:0;color:#7a3e48}
.zb-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
@media(min-width:768px){.zb-gallery{gap:14px}}
.zb-tile{aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center}
.zb-tile svg{width:74%;height:74%}
.zb-tile:nth-child(odd){transform:rotate(-1.5deg)}
.zb-tile:nth-child(even){transform:rotate(1.5deg)}
.zb-t1{background:#fdeef1}
.zb-t2{background:#fdf6ec}
.zb-t3{background:#eef5ef}
.zb-t4{background:#fdeef1}
.zb-t5{background:#eef3f8}
.zb-t6{background:#fdf6ec}
.zb-note{margin:0;font-size:13px;color:#8a7d80;text-align:center}
.zb-foot{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:6px;padding-bottom:8px}
.zb-cta{margin:0;font-size:15px;color:#585254;text-align:center}
.zb-compact{max-width:280px}
.zb-compact .zb-btn{min-height:50px;padding:8px 16px}
.zb-compact .zb-bt b{font-size:15px}

</style>
