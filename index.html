<style>
html,body{margin:0;padding:0}
body{background:#fdf6ef;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#251f21}
main{display:block;box-sizing:border-box;max-width:520px;min-height:100vh;margin:0 auto;padding:24px 20px 32px;background:#fff;box-shadow:0 0 24px rgba(122,62,72,.08)}
.zb-hero{margin:-24px -24px 0;background:linear-gradient(#fdeef1,#fff 85%);text-align:center}
@media(min-width:768px){.zb-hero{margin:-36px -36px 0}}
.zb-awning{height:38px;background:repeating-linear-gradient(90deg,#d9889b 0 26px,#fdf1f3 26px 52px)}
.zb-scallop{height:12px;background:radial-gradient(circle at 13px 0,#d9889b 12.5px,rgba(0,0,0,0) 13.5px) 0 0/52px 13px repeat-x,radial-gradient(circle at 39px 0,#fdf1f3 12.5px,rgba(0,0,0,0) 13.5px) 0 0/52px 13px repeat-x}
.zb-hero-in{padding:18px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:7px}
.zb-hero-art{position:relative;display:flex;align-items:center;justify-content:center;width:162px;height:130px;border-radius:50%;background:#fff;box-shadow:0 8px 24px rgba(122,62,72,.12)}
.zb-h1{position:absolute;top:14px;inset-inline-start:18px}
.zb-h2{position:absolute;bottom:18px;inset-inline-end:22px}
.zb-title{font-family:Georgia,'Times New Roman',serif;font-size:40px;line-height:1.1;margin:6px 0 0;color:#7a3e48;letter-spacing:-.02em;direction:ltr}
.zb-tag{margin:0;font-size:19px;font-weight:600;color:#a35567}
.zb-sub{margin:0 0 6px;color:#585254;font-size:15px}
.zb-btns{display:flex;flex-direction:column;gap:9px;width:100%;max-width:300px}
.zb-btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;box-sizing:border-box;padding:8px 18px;border-radius:32px;color:#fff;text-decoration:none;direction:ltr;box-shadow:0 4px 12px rgba(122,62,72,.18)}
.zb-bt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.zb-bt b{font-size:16px;font-weight:600}
.zb-bt small{font-size:12px;font-weight:350;opacity:.92;direction:ltr}
.zb-ig{background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af)}
.zb-fb{background:#1877f2}
</style>
</head>
